services:
  - type: web
    name: impostor-ti-api
    runtime: node
    plan: free
    region: virginia
    branch: main
    buildCommand: npm ci --include=dev && npm run build:server
    startCommand: npm run start:server
    healthCheckPath: /health
    numInstances: 1
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/server/**
        - packages/shared/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24
      - key: ALLOWED_ORIGINS
        value: https://fernandobalbino.github.io
